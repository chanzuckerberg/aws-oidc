{{define "form"}}{{template "head" .}}
<div class="page-full">
  <h1>Register new agent</h1>
  {{if .Error}}<p class="err">{{.Error}}</p>{{end}}

  <div class="card" style="max-width:480px;">
    <form method="post" action="{{.BasePath}}/agents">
      <p>
        <label>Name<br>
          <input name="name" required pattern="[a-zA-Z0-9_-]+" placeholder="my-agent" size="32" autofocus>
        </label>
        <p class="hint">Letters, numbers, dashes and underscores only.</p>
      </p>
      <p>
        <label>Display name (optional)<br>
          <input name="display-name" placeholder="My Agent" size="32">
        </label>
      </p>
      <p>
        <button class="btn primary" type="submit">Create agent</button>
        <a class="btn" href="{{.BasePath}}/">Cancel</a>
      </p>
    </form>
  </div>
</div>
{{template "foot" .}}{{end}}
