# yaml-language-server: $schema=https://chanzuckerberg.github.io/argus/schemas/argus-ci.schema.json
version: 1

apps:
  aws-oidc:
    build:
      filters:
        branches: ["!main"]
      images:
        aws-oidc:
          context: .
          dockerfile: ./Dockerfile
        agent:
          context: .
          dockerfile: ./Dockerfile.agent
          platforms: [linux/amd64, linux/arm64]
          # anchors targets only the tag line with &agent-image in values.yaml, so this
          # build never accidentally clobbers the operator/portal image tags.
          anchors: [agent-image]
    envs:
      rdev: {}
      prod: {}
