###### Generated using `argus bootstrap` command ######
stack:
  services:
    aws-oidc:
      image:
        tag: sha-c8964ff
      # This rdev stack is for the portal, which owns the stack root path. The config
      # server is not exercised here, so disable its routing to avoid a host+path
      # collision with the portal.
      ingress:
        enabled: false
      gateway:
        enabled: false
    # The agent-registry portal. rdev-only for now: there is no browser login yet, so it
    # is not exposed in prod. Identity comes from PORTAL_DEV_SUB below.
    portal:
      image:
        repository: 533267185808.dkr.ecr.us-west-2.amazonaws.com/core-platform/aws-oidc/aws-oidc
        tag: sha-c8964ff
      serviceAccount:
        create: true
        name: portal
      resources:
        limits:
          cpu: 300m
          memory: 500Mi
        requests:
          cpu: 300m
          memory: 500Mi
      args:
        - serve-portal
        - -v
      gateway:
        # Put the Okta login wall in front of the portal via an Envoy Gateway
        # SecurityPolicy. Client id, secret, and issuer default to the shared
        # argus-global-oidc app, whose redirect URIs cover the rdev cluster hosts.
        oidcProtected: true
        paths:
          - path: /
            pathType: Prefix
      oidcProxyGateway:
        # The gateway forwards the Okta ID token in this cookie (Envoy Gateway does not yet
        # forward it as a header). Pin the name so the portal can read it via
        # PORTAL_ID_TOKEN_COOKIE below.
        cookieNames:
          idToken: IdToken-portal
      livenessProbe:
        httpGet:
          path: /health
      readinessProbe:
        httpGet:
          path: /health
      env:
        - name: OKTA_CLIENT_ID
          value: 0oa1be0s0d6KhEAed1t8
        - name: OKTA_ISSUER_URL
          value: https://czi.okta.com
        - name: OKTA_SERVICE_CLIENT_ID
          value: 0oa18b7m1cb97rFLK1t8
        # Identity comes from the Okta ID token the gateway OIDC proxy forwards in this cookie.
        # To impersonate a specific user for testing instead, set PORTAL_DEV_SUB (and
        # PORTAL_DEV_EMAIL) to their Okta user id; that overrides the cookie and grants admin.
        - name: PORTAL_ID_TOKEN_COOKIE
          value: IdToken-portal
    # The agent-registry operator. Watches Agent CRs and provisions per-agent IAM roles by
    # assuming each target account's agent-provisioner role. Its ServiceAccount is bound
    # (via IRSA) to the operator control-plane role in core-platform-nonprod, which is
    # trusted to assume the per-account provisioner roles. rdev-only for now.
    operator:
      image:
        repository: 533267185808.dkr.ecr.us-west-2.amazonaws.com/core-platform/aws-oidc/aws-oidc
        # Pin to an immutable sha tag (not the mutable branch tag) so a new image is actually
        # pulled on change; with the branch tag and IfNotPresent, nodes cache a stale image.
        tag: sha-c8964ff
      serviceAccount:
        create: true
        name: agent-operator
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::471112759938:role/agent-registry-operator
      resources:
        limits:
          cpu: 300m
          memory: 300Mi
        requests:
          cpu: 100m
          memory: 128Mi
      args:
        - operator
        # Single replica in rdev, so leader election (and its lease RBAC) is not needed.
        - --leader-election=false
        # Serve health on the stack service port so the default probes reach it.
        - --health-probe-bind-address=:8080
        # Shared agent Okta app client id (shared-infra okta-czi output oidc_agent_client_id).
        - --okta-app-client-id=0oa1djle01a21Qbo71t8
        - --provisioner-role-name=agent-provisioner
        # Standard tags applied to every agent role, alongside the operator's own
        # managedBy/owner and per-agent tags.
        - --role-tags=project=agent-registry,env=rdev,service=aws-oidc
        - -v
      # The operator serves no traffic; it only needs the health endpoint.
      ingress:
        enabled: false
      livenessProbe:
        httpGet:
          path: /healthz
      readinessProbe:
        httpGet:
          path: /readyz
