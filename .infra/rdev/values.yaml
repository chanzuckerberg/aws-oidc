###### Generated using `argus bootstrap` command ######

# Agent image for workspace pods. Updated automatically by Argus CI on every agent build.
# The anchor is targeted by the 'agent' image entry in .argus-ci.yaml (anchors: [agent-image]).
# The Helm template for agent-defaults.yaml composes repository + tag into the full image ref.
agentImage:
  repository: 533267185808.dkr.ecr.us-west-2.amazonaws.com/core-platform/aws-oidc/agent
  tag: &agent-image sha-0c3dab8

stack:
  global:
    volumes:
      - name: agent-defaults
        configMap:
          name: agent-operator-defaults
      - name: agent-managed-settings
        configMap:
          name: agent-managed-settings
          defaultMode: 0755
  services:
    aws-oidc:
      image:
        tag: sha-0c3dab8
      # Overrides the common args to enable agent config generation in rdev. Arrays replace
      # rather than merge, so serve-config and -v are repeated here.
      args:
        - serve-config
        # Shared agent Okta app client id (shared-infra okta-czi output oidc_agent_client_id).
        # With this set, the config endpoint also returns each caller's agent profiles.
        - --agent-client-id=0oa1djle01a21Qbo71t8
        - -v
      gateway:
        enabled: true
        paths:
          - path: /
            pathType: Prefix
    portal:
      image:
        repository: 533267185808.dkr.ecr.us-west-2.amazonaws.com/core-platform/aws-oidc/aws-oidc
        tag: sha-0c3dab8
      serviceAccount:
        create: true
        name: portal
      resources:
        limits:
          cpu: 300m
          memory: 500Mi
        requests:
          cpu: 300m
          memory: 500Mi
      volumeMounts:
        - name: agent-defaults
          mountPath: /etc/aws-oidc
      args:
        - serve-portal
        # Offer running agents as pods. The operator below is configured with the cluster's
        # OIDC issuer, so a workspace's pod can assume the agent's roles.
        - --agent-runtime
        - --tailscale
        - --defaults-config=/etc/aws-oidc/defaults.yaml
        - -v
      gateway:
        oidcProtected: true
        enabled: true
        paths:
          - path: /portal
            pathType: Prefix
      oidcProxyGateway:
        # The gateway encrypts its session cookies, so the portal cannot read the token from
        # them. Forward the access token in the Authorization header instead; the portal
        # verifies it against Okta and reads the user id from its uid claim.
        forwardAccessToken: true
      livenessProbe:
        httpGet:
          path: /health
      readinessProbe:
        httpGet:
          path: /health
      env:
        - name: OKTA_CLIENT_ID
          value: 0oa1be0s0d6KhEAed1t8
        - name: OKTA_ISSUER_URL
          value: https://czi.okta.com
        - name: OKTA_SERVICE_CLIENT_ID
          value: 0oa18b7m1cb97rFLK1t8
        # The client the gateway OIDC proxy authenticates with (the shared argus-global-oidc
        # app). The forwarded access token's cid must match this, which binds the token to the
        # gateway app. This is not the portal's own OKTA_CLIENT_ID above.
        - name: PORTAL_OIDC_CLIENT_ID
          value: 0oa1dq1cyypCpOau01t8
        - name: PORTAL_BASE_PATH
          value: /portal
        # Groups are not in the access token, so the portal reads them from Okta userinfo to
        # decide who gets the admin view. Set this to the Okta admin group(s), comma-separated.
        - name: PORTAL_ADMIN_GROUPS
          value: ""
        # To impersonate a specific user for testing, set PORTAL_DEV_SUB (and PORTAL_DEV_EMAIL)
        # to their Okta user id; that bypasses the gateway token and grants admin.
        # The shared GitHub App powers the Repositories page: the portal searches and validates
        # the repositories an agent may clone against what these installations can reach. Same
        # ids as the operator below. The private key is not here: set GITHUB_APP_PRIVATE_KEY on
        # this service with `argus set secret`, and the page stays hidden until it is.
        - name: GITHUB_APP_ID
          value: "4783816"
        - name: GITHUB_APP_INSTALLATION_ID
          value: "158028824"
        - name: GITHUB_APP_INSTALLATION_MAP
          value: "evolutionaryscale=158867890"
    # The agent-registry operator. Watches Agent CRs and provisions per-agent IAM roles by
    # assuming each target account's agent-provisioner role. Its ServiceAccount is bound
    # (via IRSA) to the operator control-plane role in core-platform-nonprod, which is
    # trusted to assume the per-account provisioner roles. rdev-only for now.
    operator:
      image:
        repository: 533267185808.dkr.ecr.us-west-2.amazonaws.com/core-platform/aws-oidc/aws-oidc
        # Pin to an immutable sha tag (not the mutable branch tag) so a new image is actually
        # pulled on change; with the branch tag and IfNotPresent, nodes cache a stale image.
        tag: sha-0c3dab8
      serviceAccount:
        create: true
        name: agent-operator
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::471112759938:role/agent-registry-operator
      resources:
        limits:
          cpu: 300m
          memory: 300Mi
        requests:
          cpu: 100m
          memory: 128Mi
      volumeMounts:
        - name: agent-defaults
          mountPath: /etc/aws-oidc
      args:
        - operator
        # Single replica in rdev, so leader election (and its lease RBAC) is not needed.
        - --leader-election=false
        # Serve health on the stack service port so the default probes reach it.
        - --health-probe-bind-address=:8080
        # Shared agent Okta app client id (shared-infra okta-czi output oidc_agent_client_id).
        - --okta-app-client-id=0oa1djle01a21Qbo71t8
        - --provisioner-role-name=agent-provisioner
        # Standard tags applied to every agent role, alongside the operator's own
        # managedBy/owner and per-agent tags.
        - --role-tags=project=agent-registry,env=rdev,service=aws-oidc
        # dev-central's OIDC issuer. Setting it is what turns on running agents in the cluster:
        # each agent role trusts this issuer for that agent's workspace service accounts, so a
        # workspace's pod assumes the role with its projected token. The provider must also be
        # registered in every account holding agent roles (shared-infra).
        - --cluster-oidc-provider=oidc.eks.us-west-2.amazonaws.com/id/A72DBBC7C19B4B419EEA3497A3A4CC03
        - --defaults-config=/etc/aws-oidc/defaults.yaml
        # Mount Claude's enterprise settings and SSH guard into every workspace pod.
        - --managed-settings-configmap=agent-managed-settings
        - -v
      env:
        - name: ARGOCD_APPLICATION
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['app.kubernetes.io/instance']
        # Claude Workload Identity Federation. Non-secret identifiers from the Claude Console
        # (platform.claude.com > Settings > Workload Identity Federation > remote-agent-rdev).
        - name: ANTHROPIC_FEDERATION_RULE_ID
          value: fdrl_01JvnDmJXHSgUteRh5DNky25
        - name: ANTHROPIC_ORGANIZATION_ID
          value: b46fb0b7-0e07-435c-9bea-a59af9f39043
        - name: ANTHROPIC_SERVICE_ACCOUNT_ID
          value: svac_01EpQjQEhcsene64iA8AkyGZ
        - name: ANTHROPIC_TOKEN_AUDIENCE
          value: https://api.anthropic.com
        # The shared GitHub App agents clone and open pull requests as. Neither id is a
        # secret. The private key is not here: it reaches the operator as
        # GITHUB_APP_PRIVATE_KEY, set with `argus set secret`.
        - name: GITHUB_APP_ID
          value: "4783816"
        - name: GITHUB_APP_INSTALLATION_ID
          value: "158028824"
        # Extra installations of the same app, keyed by repository owner, so agents can also
        # reach repositories outside the default organization. evolutionaryscale is the app's
        # installation on the EvolutionaryScale org.
        - name: GITHUB_APP_INSTALLATION_MAP
          value: "evolutionaryscale=158867890"
        # Tailscale OIDC enrollment. The OIDC client id comes from the Tailscale admin console
        # (Settings > OAuth clients); fill in the real id before deploying.
        # Format: api.tailscale.com/<oidc-client-id>
        - name: TAILSCALE_TOKEN_AUDIENCE
          value: "api.tailscale.com/TjHt1v2bSH11CNTRL-kz7ofAGpBJ11CNTRL"
        - name: TAILSCALE_TAG
          value: "tag:mantis-shrimp"
      # The operator serves no traffic; it only needs the health endpoint.
      ingress:
        enabled: false
      livenessProbe:
        httpGet:
          path: /healthz
      readinessProbe:
        httpGet:
          path: /readyz
