# RBAC for the aws-oidc config server (rdev). It reads the rolemap ConfigMap for human
# config and reads Agent custom resources to build each caller's agent config. There is no
# cronjob in rdev, so only read access is granted; the server treats a missing ConfigMap or
# a missing Agent CRD as empty. The ServiceAccount is created by the stack chart
# (serviceAccount.create).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rolemap-reader
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["rolemap"]
    verbs: ["get"]
  - apiGroups: ["agents.czi.team"]
    resources: ["agents"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rolemap-reader
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rolemap-reader
subjects:
  - kind: ServiceAccount
    name: aws-oidc
    namespace: {{ .Release.Namespace }}
---
# The portal reads the rolemap ConfigMap (for entitlements) and CRUDs Agent custom
# resources (the agent registry). The ServiceAccount is created by the stack chart
# (serviceAccount.create).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portal
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["rolemap"]
    verbs: ["get"]
  - apiGroups: ["agents.czi.team"]
    resources: ["agents"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portal
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portal
subjects:
  - kind: ServiceAccount
    name: portal
    namespace: {{ .Release.Namespace }}
---
# The operator watches Agent CRs and writes their status. It watches cluster-wide, so it
# needs a ClusterRole. The name is namespaced so parallel rdev stacks do not collide on the
# cluster-scoped object.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-agent-operator
rules:
  - apiGroups: ["agents.czi.team"]
    resources: ["agents"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["agents.czi.team"]
    resources: ["agents/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["agents.czi.team"]
    resources: ["agents/finalizers"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-agent-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-agent-operator
subjects:
  - kind: ServiceAccount
    name: agent-operator
    namespace: {{ .Release.Namespace }}
---
# The operator also runs each agent's threads as pods in this namespace. That access is
# namespaced rather than cluster-wide: the operator can create workloads only where it lives,
# so a compromised operator cannot place pods elsewhere in the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-operator-threads
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-operator-threads
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-operator-threads
subjects:
  - kind: ServiceAccount
    name: agent-operator
    namespace: {{ .Release.Namespace }}
