---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: agents.agents.czi.team
spec:
  group: agents.czi.team
  names:
    categories:
    - czi
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
    - agt
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .spec.ownerEmail
      name: Owner
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          Agent is a registered agent and the scoped AWS access granted to it. The CR is the
          source of truth; there is no separate database.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentSpec is the desired state a human sets through the portal.
            properties:
              displayName:
                description: |-
                  DisplayName is the human-friendly name shown in the portal. Defaults to the
                  resource name when unset.
                type: string
              grants:
                description: Grants is the desired set of per-account access.
                items:
                  description: |-
                    Grant is one unit of desired access: a catalog policy the agent may use in a target
                    account. It is set by the owner through the portal and must always be a subset of the
                    owner's own access. The operator turns each grant into a per-agent IAM role.
                  properties:
                    accountId:
                      description: AccountID is the 12-digit AWS account the grant
                        targets.
                      pattern: ^[0-9]{12}$
                      type: string
                    catalogPolicyId:
                      description: |-
                        CatalogPolicyID selects one of the curated grantable policies. Free-form policy is
                        never allowed; the value must exist in the catalog and be within the owner's access.
                      minLength: 1
                      type: string
                    region:
                      description: Region is the default AWS region for the agent's
                        profile in this account.
                      type: string
                  required:
                  - accountId
                  - catalogPolicyId
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              owner:
                description: |-
                  Owner is the Okta subject of the person who registered the agent. The portal and
                  the admission webhook stamp and verify this. An agent's access can never exceed the
                  owner's, and one person cannot assume another person's agent roles.
                minLength: 1
                type: string
              ownerEmail:
                description: OwnerEmail is the owner's email, kept for display and
                  audit.
                type: string
            required:
            - owner
            type: object
          status:
            description: |-
              AgentStatus is what the operator has provisioned. It is a subresource, so the portal's
              writes to spec never race the operator's writes to status.
            properties:
              conditions:
                description: Conditions holds the standard Ready condition.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              grants:
                description: Grants is the per-grant provisioning result, aligned
                  with spec.grants.
                items:
                  description: |-
                    GrantStatus is what the operator provisioned for one grant. The config server reads
                    RoleARN to build the agent's aws-oidc profile.
                  properties:
                    accountId:
                      description: AccountID matches the desired grant's account.
                      type: string
                    catalogPolicyId:
                      description: CatalogPolicyID matches the desired grant's catalog
                        policy.
                      type: string
                    message:
                      description: Message carries the reason when State is Failed.
                      type: string
                    roleArn:
                      description: RoleARN is the per-agent IAM role the operator
                        created under /agents/.
                      type: string
                    state:
                      description: State is the provisioning state of this grant.
                      enum:
                      - Pending
                      - Provisioned
                      - Failed
                      type: string
                  required:
                  - accountId
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              observedGeneration:
                description: ObservedGeneration is the spec generation the operator
                  last reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
