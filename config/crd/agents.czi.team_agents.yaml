---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: agents.agents.czi.team
spec:
  group: agents.czi.team
  names:
    categories:
    - czi
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
    - agt
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .spec.ownerEmail
      name: Owner
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.threads[*].name
      name: Threads
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          Agent is a registered agent and the scoped access granted to it. The CR is the source of
          truth; there is no separate database.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentSpec is the desired state a human sets through the portal.
            properties:
              displayName:
                description: |-
                  DisplayName is the human-friendly name shown in the portal. Defaults to the
                  resource name when unset.
                type: string
              grants:
                description: Grants is the desired set of access, one entry per provider
                  target.
                items:
                  description: |-
                    Grant is one unit of access granted to an agent. It is a union: exactly one provider
                    section is set. AWS is the only provider today; other third parties (for example Jira,
                    GitHub, Slack, Google Workspace) are added as sibling fields here so an agent can hold
                    scoped access across many systems in one resource.
                  maxProperties: 1
                  minProperties: 1
                  properties:
                    aws:
                      description: AWS grants the agent a role in an AWS account.
                      properties:
                        accountAlias:
                          description: AccountAlias is the human-friendly account
                            name, kept for display.
                          type: string
                        accountId:
                          description: AccountID is the 12-digit AWS account the grant
                            targets.
                          pattern: ^[0-9]{12}$
                          type: string
                        region:
                          description: Region is the default AWS region for the agent's
                            profile in this account.
                          type: string
                        roleArn:
                          description: RoleARN is the role the agent may assume in
                            the account.
                          minLength: 1
                          type: string
                        roleName:
                          description: RoleName is the role name derived from the
                            ARN, kept for display.
                          type: string
                      required:
                      - accountId
                      - roleArn
                      type: object
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              owner:
                description: |-
                  Owner is the Okta subject of the person who registered the agent. The portal and
                  the admission webhook stamp and verify this. An agent's access can never exceed the
                  owner's, and one person cannot assume another person's agent access.
                minLength: 1
                type: string
              ownerEmail:
                description: OwnerEmail is the owner's email, kept for display and
                  audit.
                type: string
              runtime:
                description: |-
                  Runtime describes how the agent runs in the cluster. When unset the agent has no pods
                  and exists only as the access granted to it.
                properties:
                  args:
                    description: Args overrides the image arguments.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  command:
                    description: Command overrides the image entrypoint.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  env:
                    description: Env is extra environment for the agent container.
                    items:
                      description: |-
                        AgentEnvVar is a plain environment variable for an agent's containers. It deliberately has
                        no valueFrom: an agent owner must not be able to project arbitrary namespace secrets into
                        their own pod.
                      properties:
                        name:
                          minLength: 1
                          type: string
                        value:
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  image:
                    description: Image overrides the operator's default agent image.
                    type: string
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: NodeSelector pins the pods to a class of node.
                    type: object
                  resources:
                    description: |-
                      Resources is the compute the container requests. The portal sets requests and limits
                      to the same values so the pod is Guaranteed.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This is an alpha field and requires enabling the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                  storageClass:
                    description: |-
                      StorageClass overrides the operator's default storage class for the agent's workspace
                      PVC. Must be a ReadWriteMany class; on EFS the value is a billing-only placeholder and
                      the filesystem grows without bound.
                    type: string
                  workspaceSize:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      WorkspaceSize is the storage requested for the agent's shared workspace PVC. On EFS
                      this is a placeholder only; the filesystem is not actually bounded by this value.
                      Defaults to 50Gi when unset.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                type: object
              tailscale:
                description: |-
                  Tailscale enrolls the agent's pods in the tailnet and fixes the SSH login name to the
                  owner's email local part. When nil the agent has no tailnet identity.
                properties:
                  sshUser:
                    description: |-
                      SSHUser is the only Linux username the agent may use when connecting to tailnet devices
                      over SSH. The portal fixes this to the owner's email local part.
                    minLength: 1
                    pattern: ^[a-z_][a-z0-9_-]*$
                    type: string
                required:
                - sshUser
                type: object
              threads:
                description: |-
                  Threads is the set of threads to run. Each gets its own pod and workspace. It is a map
                  list so the API server rejects duplicate names and two writers editing different
                  threads do not clobber each other. Ignored when Runtime is unset.
                items:
                  description: |-
                    AgentThread is one running thread of an agent: its own pod and its own workspace, sharing
                    the agent's access. A person runs several threads of the same agent at once.
                  properties:
                    displayName:
                      description: DisplayName is the human-friendly label shown in
                        the portal.
                      type: string
                    name:
                      description: Name identifies the thread within the agent and
                        names its Kubernetes objects.
                      maxLength: 24
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    suspended:
                      description: Suspended scales the thread to zero replicas while
                        keeping its workspace intact.
                      type: boolean
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - owner
            type: object
          status:
            description: |-
              AgentStatus is what the operator has provisioned. It is a subresource, so the portal's
              writes to spec never race the operator's writes to status.
            properties:
              conditions:
                description: Conditions holds the standard Ready condition.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              grants:
                description: Grants is the per-grant provisioning result, aligned
                  with spec.grants.
                items:
                  description: GrantStatus is what the operator provisioned for one
                    grant, mirroring the spec union.
                  properties:
                    aws:
                      description: AWS holds AWS provisioning detail when Provider
                        is "aws".
                      properties:
                        accountId:
                          description: AccountID echoes the grant's account.
                          type: string
                        roleArn:
                          description: RoleARN is the per-agent role the operator
                            provisioned for the agent to assume.
                          type: string
                      type: object
                    message:
                      description: Message carries the reason when State is Failed.
                      type: string
                    provider:
                      description: Provider names the third party this grant targets
                        (for example "aws").
                      type: string
                    state:
                      description: State is the provisioning state of this grant.
                      enum:
                      - Pending
                      - Provisioned
                      - Failed
                      type: string
                  required:
                  - provider
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              observedGeneration:
                description: ObservedGeneration is the spec generation the operator
                  last reconciled.
                format: int64
                type: integer
              threads:
                description: Threads is the per-thread provisioning result, one entry
                  per spec.threads entry.
                items:
                  description: ThreadStatus is what the operator provisioned for one
                    thread.
                  properties:
                    message:
                      description: Message carries the reason when State is Failed.
                      type: string
                    name:
                      description: Name matches the thread's name in spec.threads.
                      type: string
                    readyReplicas:
                      description: ReadyReplicas is how many of the thread's pods
                        are ready (zero or one).
                      format: int32
                      type: integer
                    serviceAccountName:
                      description: |-
                        ServiceAccountName is the thread's Kubernetes service account, whose projected token
                        the pod exchanges for the agent's AWS roles.
                      type: string
                    state:
                      description: State is the thread's running state.
                      enum:
                      - Pending
                      - Running
                      - Suspended
                      - Failed
                      type: string
                    statefulSetName:
                      description: StatefulSetName is the workload running the thread.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              workspaceClaimName:
                description: |-
                  WorkspaceClaimName is the PVC shared by all of the agent's threads. Each thread
                  mounts it at its own subPath, so threads can share files through the shared directory
                  while keeping their own working trees separate.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
